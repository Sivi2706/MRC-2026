; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; PlatformIO Project Configuration File
; Kalman Apogee Detector — ESP32 + BMI160 + BMP280 + MicroSD
;
; Notes:
;   - Wire, SPI, SD are built into the espressif32 Arduino framework (no lib_deps entry)
;   - BMI160 uses direct I2C register access in the code (no library needed)
;   - Only Adafruit BMP280 and its sensor abstraction dependency are external

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ── Serial monitor baud rate (must match Serial.begin(115200) in code) ───────
monitor_speed = 115200

; ── Upload speed ─────────────────────────────────────────────────────────────
upload_speed  = 921600

; ── External library dependencies ────────────────────────────────────────────
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor  @ ^1.1.14
    madhephaestus/ESP32Servo @ ^3.0.5

; ── Build flags ──────────────────────────────────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=0        ; 0=silent, 5=verbose (set to 5 to debug startup)
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_RUNNING_CORE=1    ; run Arduino loop on core 1 (default)

; ── Partition scheme ─────────────────────────────────────────────────────────
; Default 4MB flash with no OTA — maximises code space
board_build.partitions = default.csv