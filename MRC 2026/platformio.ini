# PlatformIO Project Configuration File
# Kalman Apogee Detector — ESP32 (Flight & Simulation Targets)

[platformio]
default_envs = simulation

[env]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor  @ ^1.1.14
    madhephaestus/ESP32Servo
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_RUNNING_CORE=1
    -I ../sim
board_build.partitions = default.csv

; ── Auto-reset / boot-mode reliability settings ───────────────────────────────
; Lowering upload_speed (was 921600) reduces the "Wrong boot mode detected"
; error caused by USB-serial chips that can't reliably toggle DTR/RTS fast
; enough for auto-reset at very high baud rates.
upload_resetmethod        = default_reset
board_upload.use_1200bps_touch  = false
board_upload.wait_for_upload_port = true
upload_flags =
    --before=default_reset
    --after=hard_reset

; ── Simulation Target: Runs simulated rocket flight with pin triggers ─────────
[env:simulation]
build_src_filter = +<Sim_Injection_Ver.cpp> -<main.cpp> -<Hand_Test_Ver.cpp>
extra_scripts = pre:../scripts/inject_sim_data.py

; ── Live Flight Target: Runs physical BMP280 + BMI160 hardware ────────────────
[env:flight]
build_src_filter = +<main.cpp> -<Sim_Injection_Ver.cpp> -<Hand_Test_Ver.cpp>